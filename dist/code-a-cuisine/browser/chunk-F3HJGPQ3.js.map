<section class="hero" id="hero-section">
  <app-navbar variant="light" />

  <div class="hero__content">
    <div class="hero__text">
      <p class="hero__subtitle">AI-Powered<br class="hero__title-break" /> recipe generator</p>
      <h1 class="hero__title">Code à <br class="hero__title-break" />Cuisine</h1>

      <a routerLink="/generate" class="hero__cta" id="cta-get-started">
        Get started
      </a>
    </div>

    <div class="hero__visual">
      <picture>
        <source media="(max-width: 499px)" srcset="/assets/Visuals.svg" />
        <img src="/assets/visuals-wide.png" alt="plates of food" class="hero__plates" />
      </picture>
    </div>
  </div>

  <div class="hero__footer">
    <p class="hero__footer-text">Hungry for <br class="hero__title-break" />inspiration?</p>
    <a routerLink="/cookbook" class="hero__footer-link" id="link-go-to-cookbook">
      Go to cookbook
      <img src="/assets/arrow.svg" alt="Arrow" class="hero__footer-arrow" />
    </a>
  </div>
</section>
