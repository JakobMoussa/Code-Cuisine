<div class="italian-page">
    <header class="italian-header">
        <div class="italian-header__left">
            <a routerLink="/" class="italian-header__logo-link" id="italian-logo">
                <img src="/assets/logo-green.svg" alt="Code à Cuisine Logo" class="italian-header__logo" />
            </a>
            <a routerLink="/cookbook" class="italian-header__back-btn" id="italian-back-btn">
                <span class="italian-header__back-arrow">
                    <img class="back-arrow" src="/assets/back-arrow.svg" alt="arrow">
                </span>
                <span class="italian-header__back-text">Cookbook</span>
            </a>
        </div>
    </header>
    <div class="italian-header__right">
        <a routerLink="/generate" class="italian-header__generate-btn" id="italian-generate-btn">
            Generate a recipe
        </a>
    </div>

    <main class="italian-main">
        <section class="italian-banner" id="italian-banner-section">
            <img src="/assets/Italian-food.png" alt="Italian food banner" class="italian-banner__image" />
            <h1 class="italian-banner__title">Italian cuisine</h1>
        </section>

        <section class="italian-recipes" id="italian-recipes-section">
            @for (recipe of recipes; track recipe.number) {
            <article class="recipe-row" [routerLink]="['/recipe', recipe.id]">
                <div class="recipe-row__left">
                    <div class="recipe-row__time">
                        <img src="/assets/schedule.svg" alt="Clock" class="recipe-row__time-icon" />
                        <span>Cooking time: {{ recipe.cookingTime }}</span>
                    </div>
                    <div class="recipe-row__title-group">
                        <span class="recipe-row__number">{{ recipe.number }}.</span>
                        <h2 class="recipe-row__title">{{ recipe.title }}</h2>
                    </div>
                </div>

                <div class="recipe-row__right">
                    @for (tag of recipe.tags; track tag) {
                    <span class="recipe-row__tag">{{ tag }}</span>
                    }
                    <span class="recipe-row__likes">
                        <img src="/assets/smallheart.svg" alt="Heart" class="recipe-row__heart-icon" />
                        <span>{{ recipe.likes }}</span>
                    </span>
                </div>
            </article>
            }
        </section>

        <nav class="italian-pagination" aria-label="Recipes pagination">
            <span class="italian-pagination__arrow italian-pagination__arrow--disabled">&lt;</span>
            <span class="italian-pagination__item italian-pagination__item--active">1</span>
            <span class="italian-pagination__item">2</span>
            <span class="italian-pagination__item">3</span>
            <span class="italian-pagination__ellipsis">...</span>
            <span class="italian-pagination__item">8</span>
            <span class="italian-pagination__arrow">&gt;</span>
        </nav>
    </main>
</div>
